name: enola architecture check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  enola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if enola is configured
        id: check
        run: |
          if grep -qE '^enola\.enabled:\s*true' brain.config.yml 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install enola
        if: steps.check.outputs.enabled == 'true'
        shell: bash
        run: curl -fsSL https://raw.githubusercontent.com/enola-labs/enola/main/install.sh | bash
      - name: Run enola diff
        if: steps.check.outputs.enabled == 'true'
        run: npx tsx -e "import('./extensions/pi-brain/enola.ts').then(async ({runEnolaDiff}) => { const r = await runEnolaDiff({path: process.cwd()}); console.log(r.stdout || r.stderr); if (!r.ok) process.exit(1); });"
